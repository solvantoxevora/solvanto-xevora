<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account | Solvanto Xevora</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/site-config.js"></script>
<style>:root{--bg:#101a31;--panel:#1a2a49;--text:#f7f9ff;--muted:#b4c1d8;--line:#385078;--cyan:#4be8ff;--green:#45dfa0;--danger:#ff7185}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 0%,#247f9270,transparent 30%),radial-gradient(circle at 90% 10%,#7255a060,transparent 30%),linear-gradient(145deg,#101a31,#182644)}a{color:inherit;text-decoration:none}.box{width:min(760px,calc(100% - 24px));padding:30px;border:1px solid var(--line);border-radius:24px;background:#1a2a49ee;box-shadow:0 30px 100px #0007}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{display:flex;align-items:center;gap:8px;font:700 20px "Space Grotesk"}.sxlogo{width:32px;height:32px}.brand b{color:var(--cyan)}.toplinks{display:flex;gap:7px;flex-wrap:wrap}.toplinks a{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#203456;font-size:12px}h1{font:700 36px "Space Grotesk";margin:28px 0 8px}.sub{color:var(--muted);line-height:1.6;font-size:13px}.tabs{display:flex;gap:7px;margin:22px 0 16px}.tab{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:#203456;color:#b9c5db;cursor:pointer}.tab.active{color:#fff;border-color:#46e6ff55;background:#46e6ff12}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#aab8d0;margin-bottom:6px}.field input{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0f1b31;color:#fff;outline:none}.primary{width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(100deg,var(--cyan),#8a91ff);font-weight:800;color:#07101b}.msg{font-size:12px;margin-top:12px;min-height:18px}.ok{color:var(--green)}.err{color:var(--danger)}.dashboard{margin-top:24px;padding:20px;border:1px solid var(--line);border-radius:18px;background:#ffffff06}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{padding:14px;border:1px solid #ffffff12;border-radius:12px}.stat b{font:700 25px "Space Grotesk";display:block;color:var(--cyan)}.stat span{font-size:10px;color:var(--muted)}.hidden{display:none!important}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="box"><div class="top"><div class="brand"><img class="sxlogo" src="assets/solvanto-logo.svg" alt=""> <span>SOLVANTO <b>XEVORA</b></span></div><div class="toplinks"><a href="index.html">Home</a><a href="index.html#news">News</a><a href="index.html#contact">Support</a></div></div><h1 id="title">Create your account</h1><p class="sub" id="subtitle">Create a free account with a unique username to access software downloads and private support.</p><div class="tabs"><button class="tab active" id="signupTab">Create account</button><button class="tab" id="loginTab">Sign in</button></div><div id="signup"><div class="field"><label>Email address</label><input id="se" type="email" autocomplete="email"></div><div class="field"><label>Unique username</label><input id="su" maxlength="30" autocomplete="username" placeholder="e.g. user_01"></div><div class="field"><label>Password</label><input id="sp" type="password" minlength="8" autocomplete="new-password"></div><button class="primary" id="signupBtn">Create account</button><div id="sm" class="msg"></div></div><div id="login" class="hidden"><div class="field"><label>Email</label><input id="le" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div><button class="primary" id="loginBtn">Sign in</button><div id="lm" class="msg"></div></div><div id="dashboard" class="dashboard hidden"><p id="welcome" class="sub"></p><div class="stats hidden" id="ownerStats"><div class="stat"><b id="statUsers">—</b><span>Registered users</span></div><div class="stat"><b id="statDownloads">—</b><span>Download events</span></div><div class="stat"><b id="statDownloaders">—</b><span>Unique downloaders</span></div><div class="stat"><b id="statVisitors">—</b><span>Unique visitors</span></div></div><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><a class="toplinks" href="software/retail-management.html"><span>Open Retail Management</span></a><a class="toplinks" href="index.html#contact"><span>Private Support</span></a><a class="toplinks hidden" id="adminLink" href="admin.html"><span>Website Control Panel</span></a><button class="toplinks" id="logout" style="border:1px solid var(--line);background:#203456;color:#fff;padding:8px 10px;border-radius:9px;cursor:pointer">Sign out</button></div></div></div>
<script>const c=SX_CONFIG,x=SX_CREATE_CLIENT(),sb=x.client,ready=x.ready,$=id=>document.getElementById(id);function msg(id,t,ok=false){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'err')}function showSignup(){$('signup').classList.remove('hidden');$('login').classList.add('hidden');$('signupTab').classList.add('active');$('loginTab').classList.remove('active');$('title').textContent='Create your account';$('subtitle').textContent='Create a free account with a unique username to access software downloads and private support.'}function showLogin(){$('signup').classList.add('hidden');$('login').classList.remove('hidden');$('loginTab').classList.add('active');$('signupTab').classList.remove('active');$('title').textContent='Welcome back';$('subtitle').textContent='Sign in to continue to your account and software downloads.'}$('signupTab').onclick=showSignup;$('loginTab').onclick=showLogin;$('signupBtn').onclick=async()=>{if(!ready){msg('sm','The site owner still needs to connect Supabase.');return}const email=$('se').value.trim(),username=$('su').value.trim(),password=$('sp').value;if(!/^[A-Za-z0-9_]{3,30}$/.test(username)||password.length<8){msg('sm','Use a valid username (3–30 letters/numbers/underscores) and a password of at least 8 characters.');return}const {data,error}=await sb.auth.signUp({email,password,options:{data:{username}}});if(error){msg('sm',error.message);return}if(data.session)refresh();else msg('sm','Account created. Check your email to confirm it, then sign in.',true)};$('loginBtn').onclick=async()=>{if(!ready){msg('lm','The site owner still needs to connect Supabase.');return}const {data,error}=await sb.auth.signInWithPassword({email:$('le').value.trim(),password:$('lp').value});if(error){msg('lm',error.message);return}refresh()};async function refresh(){if(!ready)return;const {data:{session}}=await sb.auth.getSession();if(!session){$('dashboard').classList.add('hidden');return}$('dashboard').classList.remove('hidden');const {data:p}=await sb.from('profiles').select('username').eq('id',session.user.id).single();$('welcome').textContent='Signed in as @'+(p?.username||'user');if((session.user.email||'').toLowerCase()===c.OWNER_EMAIL.toLowerCase()){$('ownerStats').classList.remove('hidden');$('adminLink').classList.remove('hidden');const {data:s}=await sb.rpc('get_site_stats');if(s){$('statUsers').textContent=s.registered_users??'—';$('statDownloads').textContent=s.download_events??'—';$('statDownloaders').textContent=s.unique_downloaders??'—';$('statVisitors').textContent=s.unique_visitors??'—'}}}$('logout').onclick=async()=>{if(ready)await sb.auth.signOut();location.reload()};if(ready)refresh();</script></body></html>
